[project]
name = "telemetryai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
desktop-eval = ["pypdf", "Pillow>=10.1"]  # Pillow: final-category task images
graph-viz = ["Pillow>=10.1"]
# Live graph storage uses the standard-library sqlite3 module.

[dependency-groups]
dev = ["pytest", "pypdf", "Pillow>=10.1"]  # pypdf: PDF grader tests; Pillow: vision task tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
