[project]
name = "telemetryai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
desktop-eval = ["pypdf"]
# Live graph storage uses the standard-library sqlite3 module.

[dependency-groups]
dev = ["pytest", "pypdf"]  # pypdf: PDF grader tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
